plugins {
    id 'application'
    id 'java'
}

group = 'com.soka.kelompok5'
version = '1.0.0'

repositories {
    mavenCentral()
}

dependencies {
    implementation 'com.google.code.gson:gson:2.15.0'
}

application {
    mainClass = 'com.soka.kelompok5.TopsisRealCloud'
}

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 17
}

tasks.register('verifyRealCloud', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.soka.kelompok5.TopsisRealCloudVerification'
}

tasks.named('test') {
    failOnNoDiscoveredTests = false
    dependsOn verifyRealCloud
}
